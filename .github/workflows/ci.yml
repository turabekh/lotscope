name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build test database image (PostGIS + pgvector)
        run: docker build -t lotscope/postgres:test ../docker/postgres

      - name: Integration tests
        run: uv run pytest -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://lotscope:lotscope@localhost:5432/lotscope
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-e2e-secret-key
      APP_ENV: local
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start database, cache and mail-catcher
        run: |
          docker build -t lotscope/postgres:test docker/postgres
          docker run -d --name e2e-db -p 5432:5432 \
            -e POSTGRES_USER=lotscope -e POSTGRES_PASSWORD=lotscope -e POSTGRES_DB=lotscope \
            lotscope/postgres:test
          docker run -d --name e2e-redis -p 6379:6379 redis:7-alpine
          docker run -d --name e2e-mailpit -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 \
            -e MP_SMTP_AUTH_ACCEPT_ANY=true -e MP_SMTP_AUTH_ALLOW_INSECURE=true \
            axllent/mailpit:v1.20.0
          for _ in $(seq 1 60); do
            docker exec e2e-db pg_isready -U lotscope -d lotscope && break
            sleep 2
          done
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8025/api/v1/info && break
            sleep 2
          done

      - name: Migrate and seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m lotscope.zoning.seed
          uv run python scripts/seed_e2e.py

      - name: Start the api
        working-directory: backend
        run: |
          uv run uvicorn lotscope.api.app:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done

      - name: End-to-end tests
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Stop the api
        if: always()
        run: |
          # The api runs under `uv run`, which holds the uv cache lock. Left alive it
          # blocks setup-uv's post-job `cache prune` until that times out and fails the
          # job — with every test already green.
          pkill -f "uvicorn lotscope.api.app:app" || true
          sleep 2

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
