[project]
name = "lotscope"
version = "0.1.0"
description = "Philadelphia vacant-land and infill-lot intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "geoalchemy2>=0.16.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "anthropic>=0.40.0",
    "pgvector>=0.4.2",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "stripe>=11.0.0",
    "pywebpush>=2.3.0",
    "fpdf2>=2.8.7",
    "python-multipart>=0.0.32",
    "pypdf>=6.14.2",
    "selectolax>=0.4.10",
]

[project.scripts]
lotscope = "lotscope.cli:main"

[project.optional-dependencies]
geo = [
    "shapely>=2.0.6",
]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage[toml]>=7.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "testcontainers[postgres]>=4.8.0",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotscope"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PT",
    "SIM",
    "TID",
    "RUF",
]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lotscope"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["lotscope"]

[[tool.mypy.overrides]]
module = [
    "geoalchemy2.*",
    "testcontainers.*",
    "arq.*",
    "pgvector.*",
    "py_vapid.*",
    "pywebpush.*",
    "paddleocr.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/lotscope"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: requires Docker (PostGIS testcontainer)",
]

[tool.coverage.run]
branch = true
source = ["src/lotscope"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
