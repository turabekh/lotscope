# --- city-owned: never a private sale ----------------------------------------
# The failure these guard against is telling a buyer to offer a private price on
# a lot that can only move through a public disposition process.

- id: city-owned-reed-107
  question: how much should I offer for 107 Reed St
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["city of phila", "city-owned", "city owned", "public"]
      why: The buyer must be told who owns it before anything else.
    - kind: any_of
      value: ["disposition", "land bank", "not for sale", "public process", "cannot simply", "application"]
      why: A city lot moves through a disposition process; an offer price is the wrong answer.

- id: city-owned-reed-109
  question: can I just buy 109 Reed St off the owner
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["city of phila", "city-owned", "city owned", "public"]
      why: It has to identify the public owner.
    - kind: any_of
      value: ["disposition", "land bank", "public", "process", "cannot"]
      why: '"Just buy it off the owner" is exactly the assumption that must be corrected.'

- id: city-owned-dickinson-230
  question: what's my move on 230-34 Dickinson St
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["city of phila", "city-owned", "city owned", "public"]
      why: Public ownership changes the whole play and must lead.
    - kind: any_of
      value: ["disposition", "land bank", "public", "process", "application"]
      why: The move is an application, not a bid.

- id: city-owned-2nd-1406
  question: make me an offer plan for 1406 S 2nd St
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["city of phila", "city-owned", "city owned", "public"]
      why: An offer plan for a city lot is the wrong artefact; it must say so.
    - kind: any_of
      value: ["disposition", "land bank", "public", "process", "cannot"]
      why: It must redirect to the public route rather than produce a private offer.

- id: city-owned-wharton-212
  question: who do I talk to about 212-18 Wharton St
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["redevelopment authority", "public", "city", "land bank"]
      why: The Redevelopment Authority holds it; naming the right body is the answer.
    - kind: any_of
      value: ["disposition", "public", "process", "application", "authority"]
      why: The route is the public process, not a private approach.

# --- non-vacant: decline to price as land -------------------------------------
# Each of these carries a house. Pricing it as a vacant lot would be wrong by the
# value of the structure, so the Analyst must refuse the framing.

- id: non-vacant-gerritt-323
  question: what's the land worth at 323 Gerritt St
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["not vacant", "not a vacant", "improved", "structure", "building", "house", "single family"]
      why: It carries a house; pricing it as land would be wrong by the whole structure.
    - kind: not_contains
      value: "is a vacant lot"
      why: Asserting vacancy on an improved parcel is the failure being tested.

- id: non-vacant-wilder-129
  question: price 129 Wilder St as a vacant lot for me
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["not vacant", "not a vacant", "improved", "structure", "building", "house", "single family"]
      why: The question asserts a false premise and the answer must correct it.
    - kind: not_contains
      value: "is a vacant lot"
      why: Accepting the premise is the failure.

- id: non-vacant-front-1442
  question: what would I pay for the dirt at 1442 S Front St
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["not vacant", "not a vacant", "improved", "structure", "building", "house", "single family"]
      why: '"The dirt" is still a land framing on an improved parcel.'
    - kind: not_contains
      value: "is a vacant lot"
      why: It must not confirm vacancy.

- id: non-vacant-front-1440
  question: is 1440 S Front St a teardown I can price as land
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["not vacant", "improved", "structure", "building", "house", "single family", "demolition"]
      why: A teardown is a judgement about a building that is standing; it must acknowledge it.
    - kind: not_contains
      value: "is a vacant lot"
      why: A standing house is not a vacant lot.

- id: non-vacant-howard-1433
  question: give me a land value for 1433 S Howard St
  expect_tools: [get_parcel]
  assertions:
    - kind: any_of
      value: ["not vacant", "not a vacant", "improved", "structure", "building", "house", "single family"]
      why: It has improvement value on record; a bare land figure would mislead.
    - kind: not_contains
      value: "is a vacant lot"
      why: The premise must be corrected, not accepted.

# --- Lot Diligence (Step 5.1) ------------------------------------------------
# The checklist is sold at $199, so what it says about what it cannot see matters as
# much as what it finds.

- id: diligence-cecil-runs
  question: run the diligence checklist on 902 S Cecil St
  expect_tools: [run_diligence]
  assertions:
    - kind: tool_called
      value: run_diligence
      why: A diligence request runs the checklist rather than answering from memory.
    - kind: contains
      value: "902 S CECIL"
      why: It must name the lot it checked.
    - kind: any_of
      value: ["title search", "municipal lien", "PGW", "Water Revenue"]
      why: Every checklist closes on what a title search and a lien letter must still cover.

- id: diligence-names-what-it-cannot-see
  question: does the diligence on 902 S Cecil St cover water and gas liens
  expect_tools: [run_diligence]
  assertions:
    - kind: any_of
      value: ["not in any dataset", "not visible", "cannot", "no dataset"]
      why: Water Revenue and PGW liens are not in our data and the answer must say so.
    - kind: not_contains
      value: "no liens"
      why: Absence of a source is not absence of a lien.

- id: diligence-conservatorship-is-unverified
  question: is there an Act 135 conservatorship on 902 S Cecil St
  expect_tools: [run_diligence]
  assertions:
    - kind: any_of
      value: ["Court of Common Pleas", "not in our data", "docket"]
      why: We hold no conservatorship source; the line names where to look instead.
    - kind: not_contains
      value: "there is no conservatorship"
      why: It must not assert a clean answer it cannot source.

- id: diligence-delinquency-debtor
  question: run diligence on 902 S Cecil St and tell me who the tax debt names
  expect_tools: [run_diligence]
  assertions:
    - kind: tool_called
      value: run_diligence
      why: The named debtor is a line of the checklist.
    - kind: any_of
      value: ["recorded against", "named", "not the current owner", "JONES"]
      why: The debt names a party, and who it names is the point of the line.

- id: diligence-aspen-flags
  question: what would I be taking on if I bought 3862 Aspen St
  expect_tools: [run_diligence]
  assertions:
    - kind: any_of
      value: ["flag", "open", "unverified", "clear"]
      why: The answer is a checklist read, not a summary of the lot.
    - kind: any_of
      value: ["title search", "municipal lien"]
      why: The closing block belongs in the answer to "what am I taking on".
